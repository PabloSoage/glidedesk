[package]
name = "glidedesk-desktop"
description = "glidedesk desktop client (Windows, Linux): window, decoding, input, audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "glidedesk"
path = "src/main.rs"

[dependencies]
glidedesk-client = { path = "../client" }
glidedesk-proto = { path = "../proto" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30"
wgpu = "30"
pollster = "1"
ffmpeg-sys-next = { version = "8", default-features = false, features = ["avcodec"] }
libc = "0.2"
cpal = "0.18"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
# FFmpeg linked in (vcpkg.json; scripts/build-windows.ps1): one .exe, nothing to install.
ffmpeg-sys-next = { version = "8", default-features = false, features = ["avcodec", "static"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
