[package]
name = "glidedesk-host"
description = "glidedesk session host: captures a headless GNOME session and serves it over RDP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gnome", "web"]
# Headless GNOME sessions through Mutter and PipeWire.
gnome = ["dep:zbus", "dep:pipewire", "dep:futures-util"]
# Existing X11 displays (Termux's termux-x11, X11 desktops).
x11 = ["dep:x11rb"]
# Browsers over WebRTC (page, signalling and media on one port).
web = ["dep:str0m", "dep:serde", "dep:serde_json", "dep:opus"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"], optional = true }
pipewire = { version = "0.10", optional = true }
futures-util = { version = "0.3", optional = true }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cuda-12080", "dynamic-loading"] }
libloading = "0.9"
nvenc-sys = { path = "../nvenc-sys" }
async-trait = "0.1"
rcgen = "0.14"
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP", rev = "579979e", features = ["egfx", "helper"] }
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP", rev = "579979e" }
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP", rev = "579979e" }
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP", rev = "579979e" }
ironrdp-svc = { git = "https://github.com/Devolutions/IronRDP", rev = "579979e" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "579979e" }
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP", rev = "579979e" }
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "579979e" }
libc = "0.2"
ironrdp-rdpsnd = { git = "https://github.com/Devolutions/IronRDP", rev = "579979e" }
glidedesk-proto = { path = "../proto" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
socket2 = { version = "0.6", features = ["all"] }
x11rb = { version = "0.14", default-features = false, features = ["damage", "xfixes", "xtest"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rayon = "1"
# Bindings to the system FFmpeg (libavcodec-dev): VA-API and software encoders.
ffmpeg-sys-next = { version = "8", default-features = false, features = ["avcodec"] }
str0m = { version = "0.24", default-features = false, features = ["openssl"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
opus = { version = "0.4", optional = true }
