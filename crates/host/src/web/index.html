<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>glidedesk</title>
<style>
  :root {
    --bg: #0b1120; --panel: #111a2e; --line: #23304d; --text: #e5e9f2; --muted: #8b97b0;
    --accent: #22d3ee; --accent-2: #2563eb; --bad: #f87171;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; display: grid; gap: 14px; }
  h1 { margin: 0 0 4px; font-size: 20px; display: flex; gap: 10px; align-items: center; }
  h1 svg { width: 28px; height: 28px; }
  label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
  input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 8px;
    padding: 11px; background: linear-gradient(135deg, var(--accent-2), #0f172a); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #error { color: var(--bad); min-height: 1.4em; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; }
  #session { position: fixed; inset: 0; display: none; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; outline: none; }
  #bar { position: fixed; top: 8px; right: 8px; display: none; gap: 6px; align-items: center;
    background: rgba(17, 26, 46, .85); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 6px; font-size: 12px; color: var(--muted); opacity: .25; transition: opacity .2s; }
  #bar:hover { opacity: 1; }
  #bar button { padding: 4px 8px; font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
<div id="login">
  <form id="form">
    <h1><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><rect x="12" y="15" width="40" height="26" rx="3" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M26 49h12M32 41v8" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M30 22l10 8-5 1 3 6-3 1-3-6-4 3z" fill="#22d3ee"/></svg>glidedesk</h1>
    <label>User <input id="user" autocomplete="username" required></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <button id="go" type="submit">Connect</button>
    <div id="error" role="alert"></div>
    <div class="hint">The desktop takes this window's size. Full screen captures system keys where the browser allows it.</div>
  </form>
</div>
<div id="session"><video id="video" autoplay playsinline tabindex="0"></video></div>
<div id="bar"><span id="stats"></span><button id="full" type="button">Full screen</button></div>
<script>
"use strict";
// DOM KeyboardEvent.code -> PC/AT set-1 scan code (+0x100: E0 prefix), as the desktop client.
const SC = {Escape:1,Digit1:2,Digit2:3,Digit3:4,Digit4:5,Digit5:6,Digit6:7,Digit7:8,Digit8:9,Digit9:10,Digit0:11,
  Minus:12,Equal:13,Backspace:14,Tab:15,KeyQ:16,KeyW:17,KeyE:18,KeyR:19,KeyT:20,KeyY:21,KeyU:22,KeyI:23,KeyO:24,
  KeyP:25,BracketLeft:26,BracketRight:27,Enter:28,ControlLeft:29,KeyA:30,KeyS:31,KeyD:32,KeyF:33,KeyG:34,KeyH:35,
  KeyJ:36,KeyK:37,KeyL:38,Semicolon:39,Quote:40,Backquote:41,ShiftLeft:42,Backslash:43,KeyZ:44,KeyX:45,KeyC:46,
  KeyV:47,KeyB:48,KeyN:49,KeyM:50,Comma:51,Period:52,Slash:53,ShiftRight:54,NumpadMultiply:55,AltLeft:56,Space:57,
  CapsLock:58,F1:59,F2:60,F3:61,F4:62,F5:63,F6:64,F7:65,F8:66,F9:67,F10:68,NumLock:69,ScrollLock:70,Numpad7:71,
  Numpad8:72,Numpad9:73,NumpadSubtract:74,Numpad4:75,Numpad5:76,Numpad6:77,NumpadAdd:78,Numpad1:79,Numpad2:80,
  Numpad3:81,Numpad0:82,NumpadDecimal:83,IntlBackslash:86,F11:87,F12:88,IntlRo:0x73,IntlYen:0x7d,
  NumpadEnter:0x11c,ControlRight:0x11d,NumpadDivide:0x135,PrintScreen:0x137,AltRight:0x138,Pause:0x146,Home:0x147,
  ArrowUp:0x148,PageUp:0x149,ArrowLeft:0x14b,ArrowRight:0x14d,End:0x14f,ArrowDown:0x150,PageDown:0x151,
  Insert:0x152,Delete:0x153,MetaLeft:0x15b,MetaRight:0x15c,OSLeft:0x15b,OSRight:0x15c,ContextMenu:0x15d};
const $ = (id) => document.getElementById(id);
const video = $("video");
let pc, dc, pressed = new Set();

function send(m) { if (dc && dc.readyState === "open") dc.send(JSON.stringify(m)); }
function desktopSize() {
  const r = window.devicePixelRatio || 1;
  return { w: Math.round(innerWidth * r) & ~1, h: Math.round(innerHeight * r) & ~1 };
}

async function connect(user, password) {
  pc = new RTCPeerConnection({ bundlePolicy: "max-bundle" });
  const v = pc.addTransceiver("video", { direction: "recvonly" });
  pc.addTransceiver("audio", { direction: "recvonly" });
  // HEVC first where this browser decodes it, then H.264; the server picks.
  const caps = RTCRtpReceiver.getCapabilities && RTCRtpReceiver.getCapabilities("video");
  if (caps && v.setCodecPreferences) {
    const rank = (c) => /h265|hevc/i.test(c.mimeType) ? 0 : /h264/i.test(c.mimeType) ? 1 : 2;
    v.setCodecPreferences([...caps.codecs].sort((a, b) => rank(a) - rank(b)));
  }
  dc = pc.createDataChannel("input", { ordered: true });
  dc.binaryType = "arraybuffer";
  dc.onmessage = (e) => { if (e.data instanceof ArrayBuffer) setCursor(new DataView(e.data)); };
  pc.ontrack = (e) => {
    // As little buffering as the browser allows: this is a desktop, not a film.
    try { e.receiver.jitterBufferTarget = 0; } catch (_) {}
    try { e.receiver.playoutDelayHint = 0; } catch (_) {}
    if (e.track.kind === "video") video.srcObject = e.streams[0] || new MediaStream([e.track]);
    else if (video.srcObject) video.srcObject.addTrack(e.track);
    else video.srcObject = new MediaStream([e.track]);
  };
  pc.onconnectionstatechange = () => {
    if (["failed", "closed", "disconnected"].includes(pc.connectionState)) end("Connection " + pc.connectionState);
  };
  await pc.setLocalDescription(await pc.createOffer());
  const size = desktopSize();
  const r = await fetch("/offer", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user, password, sdp: pc.localDescription.sdp, width: size.w, height: size.h }) });
  if (!r.ok) throw new Error(await r.text() || r.statusText);
  const { sdp } = await r.json();
  await pc.setRemoteDescription({ type: "answer", sdp });
}

function end(reason) {
  if (pc) { pc.close(); pc = null; }
  $("session").style.display = "none"; $("bar").style.display = "none";
  $("login").style.display = ""; $("go").disabled = false;
  $("error").textContent = reason || "";
}

// Pointer shape: [0] hidden, or [1, w, h, hx, hy (u16 LE), RGBA].
function setCursor(d) {
  if (d.getUint8(0) === 0) { video.style.cursor = "none"; return; }
  const w = d.getUint16(1, true), h = d.getUint16(3, true), hx = d.getUint16(5, true), hy = d.getUint16(7, true);
  if (!w || !h) { video.style.cursor = "none"; return; }
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const img = new ImageData(new Uint8ClampedArray(d.buffer, d.byteOffset + 9, w * h * 4), w, h);
  c.getContext("2d").putImageData(img, 0, 0);
  video.style.cursor = `url(${c.toDataURL()}) ${hx} ${hy}, default`;
}

// Window position -> desktop pixel, through object-fit: contain.
function toDesktop(e) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const r = video.getBoundingClientRect();
  const s = Math.min(r.width / vw, r.height / vh);
  const ox = r.left + (r.width - vw * s) / 2, oy = r.top + (r.height - vh * s) / 2;
  const x = Math.round((e.clientX - ox) / s), y = Math.round((e.clientY - oy) / s);
  return { x: Math.max(0, Math.min(vw - 1, x)), y: Math.max(0, Math.min(vh - 1, y)) };
}

video.addEventListener("pointermove", (e) => {
  for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents().slice(-1) : [e])) {
    const p = toDesktop(ev); if (p) send({ t: "move", x: p.x, y: p.y });
  }
});
const BTN = [1, 3, 2, 4, 5]; // DOM button -> protocol (1 left, 2 right, 3 middle, 4/5 back/forward)
video.addEventListener("pointerdown", (e) => {
  video.focus(); video.setPointerCapture(e.pointerId);
  const p = toDesktop(e); if (p) send({ t: "move", x: p.x, y: p.y });
  if (BTN[e.button]) send({ t: "button", b: BTN[e.button], down: true });
  e.preventDefault();
});
video.addEventListener("pointerup", (e) => { if (BTN[e.button]) send({ t: "button", b: BTN[e.button], down: false }); e.preventDefault(); });
video.addEventListener("contextmenu", (e) => e.preventDefault());
video.addEventListener("wheel", (e) => {
  const k = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 400 : 1.2; // about 120 per notch
  if (e.deltaY) send({ t: "wheel", v: true, units: Math.max(-32768, Math.min(32767, Math.round(-e.deltaY * k))) });
  if (e.deltaX) send({ t: "wheel", v: false, units: Math.max(-32768, Math.min(32767, Math.round(e.deltaX * k))) });
  e.preventDefault();
}, { passive: false });

function key(e, down) {
  if (!pc) return;
  const sc = SC[e.code];
  if (sc !== undefined) {
    if (down) pressed.add(e.code); else pressed.delete(e.code);
    send({ t: "key", sc: sc & 0xff, ext: sc > 0xff, down });
  } else if (down && e.key && e.key.length === 1) {
    send({ t: "text", ch: e.key });
  }
  e.preventDefault();
}
addEventListener("keydown", (e) => key(e, true));
addEventListener("keyup", (e) => key(e, false));
addEventListener("blur", () => { if (pressed.size) send({ t: "release" }); pressed.clear(); });

let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { const s = desktopSize(); send({ t: "size", w: s.w, h: s.h }); }, 250);
});

$("full").onclick = async () => {
  if (document.fullscreenElement) { await document.exitFullscreen(); return; }
  await document.documentElement.requestFullscreen({ navigationUI: "hide" });
  try { await navigator.keyboard.lock(); } catch (_) {}
};

// Frame rate, bitrate and decoder from the browser's own statistics.
let last;
setInterval(async () => {
  if (!pc) return;
  for (const s of (await pc.getStats()).values()) {
    if (s.type !== "inbound-rtp" || s.kind !== "video") continue;
    if (last) {
      const dt = (s.timestamp - last.timestamp) / 1000;
      const fps = (s.framesDecoded - last.framesDecoded) / dt;
      const mbps = (s.bytesReceived - last.bytesReceived) * 8 / dt / 1e6;
      $("stats").textContent = `${s.frameWidth}×${s.frameHeight} · ${fps.toFixed(0)} fps · ${mbps.toFixed(1)} Mbit/s · ${s.decoderImplementation || ""}`;
    }
    last = s;
  }
}, 1000);

$("form").onsubmit = async (e) => {
  e.preventDefault();
  $("go").disabled = true; $("error").textContent = "";
  try {
    await connect($("user").value, $("password").value);
    $("login").style.display = "none"; $("session").style.display = "block"; $("bar").style.display = "flex";
    video.focus();
  } catch (err) { end(err.message); }
};
</script>
</body>
</html>
